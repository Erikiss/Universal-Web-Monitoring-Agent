name: LessWrong filter

on:
  workflow_dispatch:
    inputs:
      post_limit:
        description: 'Max posts to fetch (raise for a backlog catch-up)'
        required: false
        default: '100'
      lookback_days:
        description: 'Lookback window in days'
        required: false
        default: '14'
      transport:
        description: 'auto | graphql | feed'
        required: false
        default: 'auto'
      strict:
        description: 'Fail the run when LessWrong cannot be reached (1) or write a degraded report (0)'
        required: false
        default: '1'
  schedule:
    # 07:23 UTC, deliberately off the quarter hour: GitHub clusters scheduled
    # jobs on :00/:15/:30/:45 behind shared egress addresses.
    - cron: '23 7 * * *'

permissions:
  contents: write

concurrency:
  group: lesswrong-filter
  cancel-in-progress: false

jobs:
  filter:
    runs-on: ubuntu-latest
    # Must exceed the script's own LW_TIME_BUDGET_MINUTES retry allowance with
    # room to spare. A job that hits this cap is *cancelled*, and a cancelled
    # job would skip the alert below, turning a loud failure back into a silent
    # one — so the script is expected to give up first, not the runner.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Probe LessWrong reachability
        # Diagnostic only, never fails the job. Records which endpoints answer
        # from this runner so that a future block can be classified from one
        # run's log instead of by reverse-engineering the job's wall clock.
        # /api/agent/ping is LessWrong's documented reachability probe
        # (see https://www.lesswrong.com/api/SKILL.md).
        continue-on-error: true
        env:
          UA: 'Universal-Web-Monitoring-Agent/1.0 (+https://github.com/${{ github.repository }})'
        run: |
          probe() {
            method="$1"; url="$2"; shift 2
            echo "::group::$method $url"
            curl -sS -o /dev/null -D - --max-time 30 \
              -X "$method" -H "User-Agent: $UA" "$@" \
              -w '\nHTTP %{http_code} in %{time_total}s\n' "$url" || true
            echo "::endgroup::"
            sleep 3  # robots.txt asks for Crawl-Delay: 3
          }
          probe GET "https://www.lesswrong.com/api/agent/ping"
          # Exactly the URL the feed transport fetches, so the probe and the
          # real request share a cache key.
          probe GET "https://www.lesswrong.com/feed.xml?view=rss"
          # The request that actually gets refused is a POST, not a GET.
          probe POST "https://www.lesswrong.com/graphql" \
            -H 'Content-Type: application/json' \
            --data '{"query":"{ __typename }"}'

      - name: Run unit tests
        run: python -m unittest test_lw_filter.py -v

      - name: Run LessWrong filter
        env:
          MIN_WORDS: ${{ vars.MIN_WORDS || '1800' }}
          LOOKBACK_DAYS: ${{ inputs.lookback_days || vars.LOOKBACK_DAYS || '14' }}
          POST_LIMIT: ${{ inputs.post_limit || vars.POST_LIMIT || '100' }}
          POST_SCOPE: ${{ vars.POST_SCOPE || 'all' }}
          LW_TRANSPORT: ${{ inputs.transport || vars.LW_TRANSPORT || 'auto' }}
          LW_STRICT: ${{ inputs.strict || vars.LW_STRICT || '1' }}
          LW_MAX_RETRIES: ${{ vars.LW_MAX_RETRIES || '5' }}
          LW_MAX_429_RETRIES: ${{ vars.LW_MAX_429_RETRIES || '6' }}
          LW_MAX_BACKOFF_SECONDS: ${{ vars.LW_MAX_BACKOFF_SECONDS || '60' }}
          LW_RETRY_AFTER_CAP: ${{ vars.LW_RETRY_AFTER_CAP || '300' }}
          LW_REQUEST_TIMEOUT: ${{ vars.LW_REQUEST_TIMEOUT || '60' }}
          LW_CRAWL_DELAY: ${{ vars.LW_CRAWL_DELAY || '3' }}
          LW_PAGE_SIZE: ${{ vars.LW_PAGE_SIZE || '50' }}
          LW_BLOCK_STRIKES: ${{ vars.LW_BLOCK_STRIKES || '2' }}
          LW_FEED_VIEWS: ${{ vars.LW_FEED_VIEWS }}
          # Kept below timeout-minutes so the script gives up before GitHub
          # cancels the job and the alert step is skipped.
          LW_TIME_BUDGET_MINUTES: ${{ vars.LW_TIME_BUDGET_MINUTES || '10' }}
          LESSWRONG_USER_AGENT: 'Universal-Web-Monitoring-Agent/1.0 (+https://github.com/${{ github.repository }})'
        run: python lw_filter.py

      - name: Commit report
        run: |
          git config user.name "lesswrong-filter-bot"
          git config user.email "lesswrong-filter-bot@users.noreply.github.com"
          git add reports seen.json
          git diff --staged --quiet && exit 0
          git commit -m "Update LessWrong filter report"
          for i in 1 2 3 4 5; do
            git push && exit 0
            if ! git pull --rebase; then
              git rebase --abort || true
            fi
            sleep $((i * 5))
          done
          exit 1

      - name: Send failure alert
        # The whole point of failing loudly is that somebody hears it. GitHub
        # only emails scheduled-workflow failures to whoever last edited the
        # cron, so a red check on its own may notify nobody.
        #
        # cancelled() is included because timeout-minutes is enforced by
        # cancelling the job: with failure() alone, the one failure mode that
        # most needs an alert would send none.
        if: ${{ failure() || cancelled() }}
        continue-on-error: true
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          # Any step can fail — checkout, pip, tests, the filter, or the push
          # loop — so state what was observed rather than assuming which one.
          printf '%s\n' \
            "The LessWrong filter job finished with status: $JOB_STATUS." \
            "" \
            "Logs: $RUN_URL" \
            "" \
            "Check which step failed before acting. If it was 'Run LessWrong" \
            "filter', the 'Probe LessWrong reachability' step near the top of" \
            "the log shows which endpoints answered from this runner: when" \
            "/api/agent/ping is refused as well, the whole host is unreachable" \
            "and no transport change will help — see the escalation note in" \
            "README.md. A status of 'cancelled' means the job hit its" \
            "timeout-minutes cap." \
            > "$RUNNER_TEMP/alert.txt"
          python send_alert.py \
            --subject "[Web-Monitor] LessWrong filter: $JOB_STATUS" \
            --body-file "$RUNNER_TEMP/alert.txt"
