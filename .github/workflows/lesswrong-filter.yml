name: LessWrong filter

on:
  workflow_dispatch:
  schedule:
    - cron: '15 7 * * *' # Runs daily at 07:15 UTC.

permissions:
  contents: write

jobs:
  filter:
    runs-on: ubuntu-latest
    env:
      MIN_WORDS: '1800'
      LOOKBACK_DAYS: '14'
      POST_LIMIT: '30'
      POST_SCOPE: 'all'
      MAX_RETRIES: '5'
      MAX_BACKOFF_SECONDS: '60'
      LESSWRONG_USER_AGENT: 'Universal-Web-Monitoring-Agent/1.0 (+https://github.com/${{ github.repository }})'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run LessWrong filter
        run: python lw_filter.py

      - name: Commit report
        run: |
          git config user.name "lesswrong-filter-bot"
          git config user.email "lesswrong-filter-bot@users.noreply.github.com"
          git add reports seen.json
          git diff --staged --quiet && exit 0
          git commit -m "Update LessWrong filter report"
          for attempt in 1 2 3; do
            git push && exit 0
            git pull --rebase || true
            sleep $((attempt * 5))
          done
          exit 1
