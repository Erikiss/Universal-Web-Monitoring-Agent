name: Lab Publications filter

on:
  workflow_dispatch:
  # Temporarily disabled: the name-based arXiv matching has produced 0 hits
  # for weeks. The dedicated page watchers (anthropic-interpretability-watch,
  # goodfire-research-watch) replace it for now. Uncomment to re-enable.
  # schedule:
  #   - cron: '30 7 * * *' # Runs daily at 07:30 UTC.

permissions:
  contents: write

jobs:
  filter:
    runs-on: ubuntu-latest
    env:
      LOOKBACK_DAYS: '3'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Lab Publications filter
        run: python lab_pubs_filter.py

      - name: Commit report
        run: |
          git config user.name "lab-pubs-filter-bot"
          git config user.email "lab-pubs-filter-bot@users.noreply.github.com"
          git add reports seen_labs.json
          git diff --staged --quiet || git commit -m "Update Lab Publications filter report"
          git push
